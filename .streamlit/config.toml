[theme]
# Streamlit's own native widget chrome (st.toggle's track, button focus
# rings, spinner color) is fixed to whichever base is set here — it does
# not follow our custom dark-mode CSS variable swap, which is applied on
# top via inject_theme_css(). base stays "light" so native chrome doesn't
# fight the injected dark surface colors; primaryColor/backgroundColor
# below are Orchis's actual brand tokens so native widgets read as
# on-brand rather than a leftover default.
base = "light"
primaryColor = "#B979E4"
backgroundColor = "#FAF7FE"
secondaryBackgroundColor = "#F3EAFB"
textColor = "#241B36"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
# Streamlit's default is 200 MB per file, which the Knowledge Base uploader
# would happily write to disk and then push through the local embedding
# model — an easy way for one upload to fill the disk and pin the CPU for
# minutes. Support documents are text; 10 MB is generous for a real PDF
# manual. pages/1_Knowledge_Base.py enforces the same limit again in
# Python, since this setting only bounds what the server accepts.
maxUploadSize = 10

# The default file watcher re-walks every imported module's __path__ on each
# script run to support hot-reload. transformers (pulled in by the
# sentence-transformers reranker/embeddings) has hundreds of lazy-loaded
# submodules that each raise and catch a harmless ModuleNotFoundError for
# optional deps (torchvision, tensorflow) we don't use — the watcher's cost
# to walk all of that dwarfs actual request latency and made the UI feel
# frozen during streaming. Disabling it trades auto-reload-on-save for a
# responsive app; restart the server manually after editing source files.
fileWatcherType = "none"
